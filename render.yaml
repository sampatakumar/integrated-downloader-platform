services:
  - type: web
    name: mediaflow-backend
    runtime: node
    buildCommand: npm run install:all
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://media-flowyt.vercel.app
      - key: TEMP_DIR
        value: ./temp
      - key: MAX_CONCURRENT_JOBS
        value: 3
